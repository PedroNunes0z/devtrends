<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1200px; height: 630px; background: #0A0B0D; }
  body { font-family: Arial, Helvetica, sans-serif; color: #E6E8EB; padding: 64px;
         display: flex; flex-direction: column; justify-content: space-between;
         border: 1px solid #1E2127; }
  .brand { display: flex; align-items: center; gap: 14px; font-size: 24px; color: #9BA1AC; }
  .dot { width: 14px; height: 14px; border-radius: 7px; background: #82AAFF; }
  h1 { margin: 0; font-size: 68px; font-weight: 600; letter-spacing: -2px; line-height: 1.05; }
  .sub { margin-top: 20px; font-size: 28px; color: #9BA1AC; }
  .foot { display: flex; gap: 28px; font-family: monospace; font-size: 20px; color: #7B818B; }
</style></head><body>
  <div class="brand"><span class="dot"></span><span>devtrends/insights</span></div>
  <div><h1>Qual tecnologia vale<br>o seu próximo mês?</h1>
    <div class="sub">GitHub · Stack Overflow · Gemini → Índice de Vitalidade</div></div>
  <div class="foot"><span>api.github.com</span><span>stackoverflow.com</span><span>structured output</span></div>
</body></html>
